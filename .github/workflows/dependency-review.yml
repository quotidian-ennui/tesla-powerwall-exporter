name: dependency-review
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Dependency Review"
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: true
          vulnerability-check: true
          license-check: true
          fail-on-severity: moderate
          allow-dependencies-licenses: "pkg:githubactions/quotidian-ennui/actions-olio/pr-trigger, pkg:githubactions/quotidian-ennui/actions-olio/docker-image-builder"

  review-success:
    timeout-minutes: 1
    needs:
      - dependency-review
    permissions:
      contents: write
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    name: Dispatch
    steps:
      - name: dispatch
        uses: quotidian-ennui/actions-olio/pr-trigger@c2791f686b05ea34186b2a006ae563c7a03283e4 # v1.3.8
        with:
          event_type: dependency-review-success
